name: quran_halaqa
description: تطبيق متابعة حلقات القرآن الكريم - نظام النقاط.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^8.2.0
  flutter_svg: ^2.0.9
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  supabase_flutter: ^2.3.0
  path_provider: ^2.1.2
  sqflite: ^2.3.0
  path: ^1.8.3
  connectivity_plus: ^7.3.1
  intl: ^0.20.2
  uuid: ^4.2.1
  flutter_animate: ^4.5.2   # ✨ مكتبة الحركات الجديدة

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran.db
    - assets/icons/              # سنضع أيقونات SVG هنا إن وجدت
  fonts:
    - family: Uthmanic
      fonts:
        - asset: assets/fonts/KFGQPC_Uthmanic_Script.ttf
          weight: 400